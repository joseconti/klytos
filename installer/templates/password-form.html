<div id="klytos-password-gate" style="max-width:420px;margin:4rem auto;padding:2rem;text-align:center;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif">
    <svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="margin-bottom:1rem;opacity:.6"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
    <h2 style="margin:0 0 .5rem">{{password_heading}}</h2>
    <p style="color:#888;margin:0 0 1.5rem">{{password_hint}}</p>
    <form id="klytos-pw-form" style="display:flex;gap:.5rem">
        <input id="klytos-pw-input" type="password" placeholder="{{password_placeholder}}" autocomplete="off" required
            style="flex:1;padding:.6rem .8rem;border:1px solid #444;border-radius:6px;background:#1a1a1a;color:#fff;font-size:1rem">
        <button type="submit" style="padding:.6rem 1.2rem;border:none;border-radius:6px;background:#3b82f6;color:#fff;font-size:1rem;cursor:pointer">{{password_submit}}</button>
    </form>
    <p id="klytos-pw-error" style="color:#ef4444;margin-top:.75rem;display:none">{{password_wrong}}</p>
</div>
<script id="klytos-encrypted-data" type="application/json">{"salt":"{{enc_salt}}","iv":"{{enc_iv}}","data":"{{enc_data}}"}</script>
<script>
(function(){
    var form=document.getElementById('klytos-pw-form');
    var input=document.getElementById('klytos-pw-input');
    var errEl=document.getElementById('klytos-pw-error');
    var blob=JSON.parse(document.getElementById('klytos-encrypted-data').textContent);

    function b64decode(s){return Uint8Array.from(atob(s),function(c){return c.charCodeAt(0)})}

    form.addEventListener('submit',function(e){
        e.preventDefault();
        errEl.style.display='none';
        var pw=input.value;
        var enc=new TextEncoder();
        var salt=b64decode(blob.salt);
        var iv=b64decode(blob.iv);
        var data=b64decode(blob.data);

        crypto.subtle.importKey('raw',enc.encode(pw),'PBKDF2',false,['deriveKey']).then(function(baseKey){
            return crypto.subtle.deriveKey(
                {name:'PBKDF2',salt:salt,iterations:100000,hash:'SHA-256'},
                baseKey,
                {name:'AES-GCM',length:256},
                false,
                ['decrypt']
            );
        }).then(function(key){
            return crypto.subtle.decrypt({name:'AES-GCM',iv:iv},key,data);
        }).then(function(decrypted){
            var html=new TextDecoder().decode(decrypted);
            var gate=document.getElementById('klytos-password-gate');
            var container=gate.parentNode;
            gate.remove();
            document.getElementById('klytos-encrypted-data').remove();
            container.innerHTML=html;
            try{sessionStorage.setItem('klytos_pw_'+location.pathname,'1')}catch(x){}
        }).catch(function(){
            errEl.style.display='block';
            input.value='';
            input.focus();
        });
    });
})();
</script>
