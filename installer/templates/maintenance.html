<!DOCTYPE html>
<html lang="{{language}}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>{{site_name}} — Maintenance</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
             background:#1a1a1a;color:#e0e0e0;display:flex;align-items:center;
             justify-content:center;min-height:100vh;padding:2rem}
        .maintenance{text-align:center;max-width:520px}
        .maintenance h1{font-size:2rem;margin-bottom:1rem;color:#fff}
        .maintenance p{font-size:1.125rem;line-height:1.6;color:#aaa}
        .maintenance .icon{font-size:3rem;margin-bottom:1.5rem;display:block}
    </style>
</head>
<body>
    <div class="maintenance">
        <span class="icon">&#x1F6E0;</span>
        <h1>{{site_name}}</h1>
        <p>{{maintenance_message}}</p>
    </div>
</body>
</html>
